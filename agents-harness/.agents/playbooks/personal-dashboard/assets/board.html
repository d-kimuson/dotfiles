<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>パーソナルダッシュボード</title>
<style>
  html,
  body {
    height: 100%;
    margin: 0;
  }
  dpk-app {
    display: block;
    height: 100%;
  }
  .ptb-deferred {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--dpk-ink-soft);
    cursor: pointer;
  }
  .ptb-deferred[hidden] {
    display: none;
  }
  .ptb-office {
    height: 100%;
    min-height: 480px;
  }
</style>
</head>
<body>

<dpk-app lang="ja" storage-key="personal-task-board" page-nav="sidebar">
  <script type="application/json">{ "title": "パーソナルダッシュボード" }</script>
  <label slot="header" class="ptb-deferred" hidden><input type="checkbox" id="ptb-show-deferred" /><span></span></label>
  <dpk-page name="board" label="タスク">
    <dpk-board-kanban id="personal-task-board">
      <script type="application/json">
        {
          "columns": [
            { "id": "todo", "label": "Todo", "color": "gray", "cards": [] },
            { "id": "today", "label": "今日やる", "color": "amber", "cards": [] },
            { "id": "doing", "label": "進行中", "color": "blue", "cards": [] },
            { "id": "blocked", "label": "Pending", "color": "red", "cards": [] },
            { "id": "done", "label": "Done", "color": "green", "cards": [] },
            { "id": "archived", "label": "アーカイブ", "color": "gray", "cards": [] }
          ]
        }
      </script>
    </dpk-board-kanban>
  </dpk-page>
  <dpk-page name="learning" label="学習バックログ">
    <dpk-board-kanban id="personal-learning">
      <script type="application/json">
        {
          "columns": [
            { "id": "backlog", "label": "バックログ", "color": "violet", "cards": [] },
            { "id": "done", "label": "Done", "color": "green", "cards": [] },
            { "id": "archived", "label": "アーカイブ", "color": "gray", "cards": [] }
          ]
        }
      </script>
    </dpk-board-kanban>
  </dpk-page>
  <dpk-page name="office" label="Agent Office">
    <dpk-view-plain>
      <script type="application/json">{ "title": "Agent Office" }</script>
      <div slot="main" id="ptb-office" class="ptb-office"></div>
    </dpk-view-plain>
  </dpk-page>
</dpk-app>

<script type="text/plain" id="ptb-agent-office" data-src="agent-office.js"></script>

<script type="module">
  const KIT_VERSION = "0.4.4";
  const KIT = `https://cdn.jsdelivr.net/npm/dev-process-kit@${KIT_VERSION}/dist/boards.js`;
  const PLAIN = `https://cdn.jsdelivr.net/npm/dev-process-kit@${KIT_VERSION}/dist/views/plain.js`;
  const ARCHIVED = "archived";
  const DONE = "done";
  // Agent に任せているカードは Agent のタグを持つ。進行中の列はこのタグだけで分け、Agent のカードを下に置く。
  const SPLIT = "doing";
  const AGENT_TAG = "Agent";
  // 着手可能日の前に隠すのは、まだ手を付けていない列のカードだけである。
  const DEFERRABLE = ["todo", "backlog"];
  const CHECK_TAG = "確認が必要";
  const START_PREFIX = "着手可能 ";
  const DUE_PREFIX = "期日 ";
  const RECORDS_HEADING = "## 記録";
  const ASSIGNMENTS_HEADING = "## 担当";
  const STATUSES = ["In Progress", "Done"];
  const DEFERRED_KEY = "ptb.showDeferred";
  const kanbans = [...document.querySelectorAll("dpk-page > dpk-board-kanban")];

  // 印と隠す処理は、要素の items() (draft を反映した列とカード) から作る。kit が描くカードの DOM には触らない。
  const itemsOf = (el) => el.items().columns;
  const cardsOf = (el) => itemsOf(el).flatMap((column) => column.cards.map((card) => ({ column: column.id, card })));

  const tokyoStamp = (now) => {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Tokyo",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23",
    }).formatToParts(now);
    const part = (type) => parts.find((p) => p.type === type)?.value ?? "";
    return `${part("year")}-${part("month")}-${part("day")} ${part("hour")}:${part("minute")}`;
  };
  const isDate = (v) => {
    if (typeof v !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
    const year = Number(v.slice(0, 4));
    const d = new Date(`${v}T00:00:00Z`);
    return year >= 2000 && year <= 2100 && !Number.isNaN(d.getTime()) && d.toISOString().slice(0, 10) === v;
  };
  // 同じ接頭辞の日付タグが複数あれば、末尾 (最後に足したもの) を採る。draft の ADD_CARD_TAG は末尾に積まれる。
  const dateTags = (tags, prefix) => tags.filter((tag) => tag.startsWith(prefix) && isDate(tag.slice(prefix.length)));
  const tagDate = (tags, prefix) => dateTags(tags, prefix).at(-1)?.slice(prefix.length);
  // 確認が必要と日付は属性の欄で操作する。カードの表面と詳細のタグの行では、汎用のタグとして出さない。
  const isReserved = (tag) =>
    tag === CHECK_TAG ||
    (tag.startsWith(START_PREFIX) && isDate(tag.slice(START_PREFIX.length))) ||
    (tag.startsWith(DUE_PREFIX) && isDate(tag.slice(DUE_PREFIX.length)));
  const shortDate = (date) => `${Number(date.slice(5, 7))}/${Number(date.slice(8, 10))}`;
  const SECTION_START = /^\s*## (Pending の理由|担当|記録)[ \t]*(\n|$)/;
  const viewOf = (card) => {
    const tags = card.tags ?? [];
    return {
      start: tagDate(tags, START_PREFIX),
      due: tagDate(tags, DUE_PREFIX),
      agent: tags.includes(AGENT_TAG),
    };
  };

  // 担当は description の `## 担当` 節の 1 行 1 件: `- <状態> | <役割> | <runtime> | <モデル> | <セッションの参照>`。
  // CLI (card.ts) が読める行だけを担当として読む。
  const RUNTIME = /^[a-z][a-z0-9-]*$/;
  const SESSION = /^(https:\/\/claude\.ai\/code\/session_[A-Za-z0-9_-]+|[A-Za-z0-9][A-Za-z0-9._:/-]*)$/;
  const assignmentsOf = (card) => {
    const out = [];
    let inside = false;
    for (const line of (card.description ?? "").split("\n")) {
      const heading = line.trim();
      if (/^#{1,6} /.test(heading)) {
        inside = heading === ASSIGNMENTS_HEADING;
        continue;
      }
      if (!inside) continue;
      const m = /^- (.*)$/.exec(line.trimEnd());
      const fields = m?.[1].split("|").map((f) => f.trim());
      if (fields === undefined || fields.length !== 5 || !STATUSES.includes(fields[0]) || fields.some((f) => f === "")) continue;
      const [status, role, runtime, model, session] = fields;
      if (!RUNTIME.test(runtime) || (session !== "-" && !SESSION.test(session))) continue;
      // 分からない項目は - と書いてある。Office には null で渡す。
      const known = (v) => (v === "-" ? null : v);
      out.push({ status, role: role.replace(/\s+/g, " "), runtime, model: known(model), session: known(session) });
    }
    return out;
  };

  let today = tokyoStamp(new Date()).slice(0, 10);

  const readShowDeferred = () => {
    try {
      return localStorage.getItem(DEFERRED_KEY) === "1";
    } catch {
      return false;
    }
  };
  let showDeferred = readShowDeferred();
  const deferredToggle = document.getElementById("ptb-show-deferred");
  deferredToggle.checked = showDeferred;

  // 印と隠す処理は、kit が描くカードの DOM には触らず、CSS だけで行う。
  const cardSel = (id) => `.kanban-card[data-card="${CSS.escape(id)}"]`;
  const slotSel = (column, id) => `.kanban-column[data-column="${CSS.escape(column)}"] .kanban-card-slot:has(> ${cardSel(id)})`;
  const isDeferred = (column, view) => DEFERRABLE.includes(column) && view.start !== undefined && view.start > today;
  const reservedAt = (tags) => tags.flatMap((tag, index) => (isReserved(tag) ? [`:nth-child(${index + 1})`] : []));

  // 期日の色は Done とアーカイブ以外のカードに付ける。過ぎていれば超過、当日なら今日である。
  const TONE_SUFFIX = { overdue: " 超過", today: " 今日" };
  const dueTone = (column, due) => {
    if (due === undefined || column === DONE || column === ARCHIVED) return "";
    if (due < today) return "overdue";
    return due === today ? "today" : "";
  };

  const KIT_IDLE = `:not([aria-pressed="true"], :focus-visible)`;
  const attrCss = (el) => {
    const rules = [];
    const perColumn = new Map();
    for (const { column, card } of cardsOf(el)) {
      const view = viewOf(card);
      const sel = cardSel(card.id);
      const tags = card.tags ?? [];
      const tone = dueTone(column, view.due);
      // 確認が必要のカードは、題の上のバッジと amber の枠で目立たせる。期日の帯は inset の box-shadow なので、両方が見える。
      // 枠・背景・帯は、kit が選択・フォーカスを示しているカードには付けない。kit の表示を上書きしないため。
      if (tags.includes(CHECK_TAG)) {
        rules.push(`${sel}::before { content: "${CHECK_TAG}"; }`);
        rules.push(`${sel}${KIT_IDLE} { border-color: light-dark(#d97706, #f59e0b); background: light-dark(#fffbeb, rgb(245 158 11 / 0.14)); }`);
      }
      // 着手可能日と期日は、汎用のタグの代わりに専用の印を出す。
      const marks = [];
      if (view.start !== undefined) marks.push(`着手可能 ${shortDate(view.start)}`);
      if (view.due !== undefined) marks.push(`期日 ${shortDate(view.due)}${TONE_SUFFIX[tone] ?? ""}`);
      if (marks.length > 0) rules.push(`${sel}::after { content: "${marks.join("  ")}"; }`);
      if (tone !== "") {
        rules.push(`${sel} { --ptb-mark: var(--ptb-${tone}); --ptb-mark-weight: 600; }`);
        rules.push(`${sel}${KIT_IDLE} { box-shadow: inset 3px 0 0 var(--ptb-${tone}); }`);
      }
      // 予約タグを汎用のタグとして出さない。位置は card.tags の並びと同じなので :nth-child で指せる。
      const at = reservedAt(tags);
      if (at.length > 0) rules.push(`${sel} > .kanban-card-meta > .dpk-pill:is(${at.join(", ")}) { display: none; }`);
      // 本文が無く節だけのカードは、表面の説明の先頭に節の見出しと担当の行が出る。本文が無いときは説明を出さない。
      if (SECTION_START.test(card.description ?? "")) rules.push(`${sel} > .dpk-card-text { display: none; }`);
      if (column === SPLIT && view.agent) rules.push(`${slotSel(SPLIT, card.id)} { order: 2; }`);
      if (isDeferred(column, view)) {
        perColumn.set(column, (perColumn.get(column) ?? 0) + 1);
        rules.push(showDeferred ? `${slotSel(column, card.id)} { opacity: 0.55; }` : `${slotSel(column, card.id)} { display: none; }`);
      }
    }
    for (const [column, count] of perColumn) rules.push(`.kanban-column[data-column="${CSS.escape(column)}"] .kanban-column-head::after { content: "着手前 ${count}"; }`);
    return rules.join("\n");
  };
  // 隠すカードの枚数は 2 枚の盤面で 1 つの切り替えにまとめる。
  const updateDeferred = () => {
    const count = kanbans.reduce((sum, el) => sum + cardsOf(el).filter(({ column, card }) => isDeferred(column, viewOf(card))).length, 0);
    const label = deferredToggle.closest("label");
    deferredToggle.checked = showDeferred;
    label.hidden = count === 0;
    if (count === 0) return;
    const text = `着手前 ${count} 枚を表示`;
    if (label.querySelector("span").textContent !== text) label.querySelector("span").textContent = text;
  };
  deferredToggle.addEventListener("change", () => {
    showDeferred = deferredToggle.checked;
    try {
      localStorage.setItem(DEFERRED_KEY, showDeferred ? "1" : "0");
    } catch {}
    refreshAll();
  });

  // アーカイブは Done のカードを隠した列へ MOVE_CARD で移す。kit の draft に積まれ、レビューで base に反映される。
  // 対象は base ではなく、draft を反映した要素の items() の Done 列から出す。draft で Done から戻したカードを積んだり、
  // draft で Done に移したカードを漏らしたりしないためである。タグの絞り込みで DOM から外れたカードも移せる。
  // 確認が必要なカードは、本人の確認が済むまで Done に残す。
  const doneCards = (el) => itemsOf(el).find((column) => column.id === DONE)?.cards ?? [];
  const archivable = (el) => doneCards(el).filter((card) => !(card.tags ?? []).includes(CHECK_TAG));
  const ensureArchive = (el, root) => {
    const head = root.querySelector(`.kanban-column[data-column="${DONE}"] > .kanban-column-head`);
    if (head === null) return;
    let button = head.querySelector(":scope > .ptb-archive");
    if (button === null) {
      button = document.createElement("button");
      button.type = "button";
      button.className = "ptb-archive";
      button.textContent = "アーカイブ";
      button.addEventListener("pointerdown", (event) => event.stopPropagation());
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        for (const card of archivable(el)) el.dispatchElementAction("MOVE_CARD", ["card", card.id], { column: ARCHIVED, before: null });
      });
      head.append(button);
    }
    const all = doneCards(el).length;
    const done = archivable(el).length;
    if (button.disabled !== (done === 0)) button.disabled = done === 0;
    const kept = all - done === 0 ? "" : ` (確認が必要な ${all - done} 枚は残す)`;
    const title = all === 0 ? "Done にカードが無い" : `Done の ${done} 枚をアーカイブ${kept}`;
    if (button.title !== title) button.title = title;
  };

  // description の `## 記録` 節の末尾に 1 行足す。ほかの節は本人が書いたまま残す。
  const appendRecord = (description, at, author, text) => {
    const line = `- ${at} ${author}: ${text.split("\n")[0] ?? ""}`;
    const rest = text.split("\n").slice(1);
    const lines = (description ?? "").split("\n");
    const heading = lines.findIndex((l) => l.trim() === RECORDS_HEADING);
    const add = [line, ...rest.map((l) => `    ${l}`)];
    if (heading === -1) {
      const kept = (description ?? "").split("\n").filter((l) => l !== "");
      return [...kept, ...(kept.length === 0 ? [] : [""]), RECORDS_HEADING, ...add].join("\n");
    }
    let end = lines.length;
    for (let i = heading + 1; i < lines.length; i++) if (/^#{1,6} /.test((lines[i] ?? "").trim())) {
      end = i;
      break;
    }
    let at2 = end;
    while (at2 > heading + 1 && (lines[at2 - 1] ?? "").trim() === "") at2--;
    return [...lines.slice(0, at2), ...add, ...lines.slice(at2)].join("\n");
  };

  // 属性 (確認が必要・着手可能日・期日・Agent) は、詳細の専用の欄で変える。操作は kit の draft に積まれ、レビューで base に反映される。
  const cardOf = (el, id) => cardsOf(el).find((entry) => entry.card.id === id)?.card;
  const setTag = (el, card, tag, on) => {
    const current = cardOf(el, card);
    if (current === undefined) return false;
    if ((current.tags ?? []).includes(tag) === on) return true;
    return el.dispatchElementAction(on ? "ADD_CARD_TAG" : "REMOVE_CARD_TAG", ["card", card], { tag });
  };
  const setDate = (el, card, prefix, value) => {
    const current = cardOf(el, card);
    if (current === undefined) return false;
    const olds = [...new Set(dateTags(current.tags ?? [], prefix))];
    const next = value === undefined ? undefined : `${prefix}${value}`;
    if (olds.length === (next === undefined ? 0 : 1) && (next === undefined || olds[0] === next)) return true;
    let ok = true;
    for (const tag of olds) if (!el.dispatchElementAction("REMOVE_CARD_TAG", ["card", card], { tag })) ok = false;
    if (next !== undefined && !el.dispatchElementAction("ADD_CARD_TAG", ["card", card], { tag: next })) ok = false;
    return ok;
  };

  const toggle = (className, onClick) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = `ptb-toggle ${className}`;
    button.setAttribute("aria-pressed", "false");
    button.addEventListener("click", onClick);
    return button;
  };
  const setPressed = (button, on, text) => {
    const pressed = on ? "true" : "false";
    if (button.getAttribute("aria-pressed") !== pressed) button.setAttribute("aria-pressed", pressed);
    if (button.textContent !== text) button.textContent = text;
  };

  const buildAttrs = (el) => {
    const section = document.createElement("section");
    section.className = "kanban-detail-field ptb-attrs";
    const error = document.createElement("p");
    error.className = "ptb-error";
    const run = (write) => {
      error.textContent = "";
      if (!write(section.dataset.ptbCard)) error.textContent = "変えられなかった。詳細を開き直す";
    };
    const check = toggle("ptb-check", () => run((card) => setTag(el, card, CHECK_TAG, check.getAttribute("aria-pressed") !== "true")));
    const agent = toggle("ptb-agent", () => run((card) => setTag(el, card, AGENT_TAG, agent.getAttribute("aria-pressed") !== "true")));
    section.append(check, agent);
    for (const [attr, name, prefix] of [["start", "着手可能日", START_PREFIX], ["due", "期日", DUE_PREFIX]]) {
      const row = document.createElement("div");
      row.className = "ptb-date";
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.type = "date";
      input.min = "2000-01-01";
      input.max = "2100-12-31";
      input.dataset.attr = attr;
      label.append(name, input);
      const clear = document.createElement("button");
      clear.type = "button";
      clear.className = "ptb-clear";
      clear.textContent = "解除";
      clear.setAttribute("aria-label", `${name}を解除`);
      // Chrome の date 入力は年を 1 桁打つたびに change を出すので、入力が止まるか欄を離れたときに 1 回だけ積む。
      const stored = () => {
        const current = cardOf(el, section.dataset.ptbCard);
        if (current === undefined) return "";
        const view = viewOf(current);
        return ((attr === "start" ? view.start : view.due) ?? "");
      };
      let timer = 0;
      const commit = () => {
        clearTimeout(timer);
        timer = 0;
        const value = input.value;
        if (value === "" || !isDate(value)) return;
        run((card) => setDate(el, card, prefix, value));
      };
      input.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(commit, 600);
      });
      input.addEventListener("blur", () => {
        commit();
        // 打ちかけのまま欄を離れたら、draft を反映した値に戻す。
        clearTimeout(timer);
        timer = 0;
        if (input.value !== stored()) input.value = stored();
      });
      clear.addEventListener("click", () => {
        clearTimeout(timer);
        input.value = "";
        run((card) => setDate(el, card, prefix, undefined));
      });
      row.append(label, clear);
      section.append(row);
    }
    const assignments = document.createElement("ul");
    assignments.className = "ptb-assignments";
    assignments.setAttribute("aria-label", "担当");
    section.append(assignments, error);
    // 入力中のキーを kit のショートカットへ渡さない。
    for (const type of ["keydown", "keyup", "keypress"]) section.addEventListener(type, (event) => event.stopPropagation());
    return section;
  };

  const renderAssignments = (list, card) => {
    const items = assignmentsOf(card).map((a) => {
      const li = document.createElement("li");
      li.dataset.status = a.status;
      const status = document.createElement("span");
      status.className = "ptb-status";
      status.textContent = a.status;
      const role = document.createElement("strong");
      role.textContent = a.role;
      const who = document.createElement("span");
      who.textContent = `${a.runtime} / ${a.model ?? "-"}`;
      const session = document.createElement("code");
      session.textContent = a.session ?? "-";
      li.append(status, role, who, session);
      return li;
    });
    const key = JSON.stringify(assignmentsOf(card));
    if (list.dataset.key === key) return;
    list.dataset.key = key;
    list.replaceChildren(...items);
  };

  // カードの詳細は、盤面を持つページの side panel の Detail に kit が描く。
  const detailOf = (el) => {
    const panel = el.closest("dpk-page")?.shadowRoot?.querySelector("dpk-internal-layout-panel")?.shadowRoot;
    const detail = panel?.querySelector("dpk-internal-kanban-card-detail");
    return detail?.shadowRoot && typeof detail.card?.id === "string" ? detail : null;
  };

  // ShadowRoot は要素ではないので、querySelector の :scope で直下を指せない。
  const childOf = (root, className) => [...root.children].find((child) => child.classList.contains(className)) ?? null;

  const ensureAttrs = (el, detail) => {
    const root = detail.shadowRoot;
    const card = detail.card.id;
    let section = childOf(root, "ptb-attrs");
    if (section === null) {
      section = buildAttrs(el);
      const title = childOf(root, "kanban-detail-title");
      if (title === null) root.prepend(section);
      else title.after(section);
    }
    const switched = section.dataset.ptbCard !== card;
    if (switched) {
      // 前のカードで打ちかけた日付は、前のカードに積んでから切り替える。
      for (const input of section.querySelectorAll("input[type='date']")) input.blur();
      section.dataset.ptbCard = card;
      section.querySelector(".ptb-error").textContent = "";
    }
    const current = cardOf(el, card);
    if (current === undefined) return;
    const view = viewOf(current);
    const checked = (current.tags ?? []).includes(CHECK_TAG);
    setPressed(section.querySelector(".ptb-check"), checked, checked ? "確認済みにする" : "確認が必要にする");
    setPressed(section.querySelector(".ptb-agent"), view.agent, view.agent ? "Agent に任せている" : "Agent に任せる");
    renderAssignments(section.querySelector(".ptb-assignments"), current);
    const values = { start: view.start ?? "", due: view.due ?? "" };
    // 入力中の欄は、他の更新が届いても書き換えない。
    for (const input of section.querySelectorAll("input[data-attr]")) {
      if (input === root.activeElement) continue;
      const value = values[input.dataset.attr];
      // Chrome の date 入力は打ちかけの間 value が "" なので、カードを切り替えたら比べずに入れ直す。
      if (switched || input.value !== value) input.value = value;
    }
  };

  const buildComposer = (el) => {
    const section = document.createElement("section");
    section.className = "kanban-detail-field ptb-comments";
    const label = document.createElement("span");
    label.className = "dpk-label";
    label.textContent = "記録を足す";
    const form = document.createElement("div");
    form.className = "ptb-composer";
    const input = document.createElement("textarea");
    input.rows = 2;
    input.placeholder = "状況やメモを書く";
    input.setAttribute("aria-label", "カードの記録");
    const send = document.createElement("button");
    send.type = "button";
    send.textContent = "送る";
    const error = document.createElement("p");
    error.className = "ptb-error";
    form.append(input, send, error);
    section.append(label, form);
    const submit = () => {
      const text = input.value.trim();
      if (text === "" || send.disabled) return;
      const card = cardOf(el, section.dataset.ptbCard);
      if (card === undefined) {
        error.textContent = "記録を足せなかった。カードの詳細を開き直す";
        return;
      }
      const description = appendRecord(card.description, tokyoStamp(new Date()), "本人", text);
      if (!el.dispatchElementAction("SET_CARD_DESCRIPTION", ["card", card.id], { description })) {
        error.textContent = "送れなかった。もう一度試す";
        return;
      }
      input.value = "";
      error.textContent = "";
    };
    // allow-forms の無い sandbox でも送れるように、form の submit は使わず button の click で送る。
    send.addEventListener("click", submit);
    // 入力中のキーを kit のショートカットへ渡さない。
    for (const type of ["keydown", "keyup", "keypress"]) form.addEventListener(type, (event) => event.stopPropagation());
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey) && !event.isComposing) {
        event.preventDefault();
        submit();
      }
    });
    return section;
  };

  const ensureComposer = (el, detail) => {
    const root = detail.shadowRoot;
    const card = detail.card.id;
    let section = childOf(root, "ptb-comments");
    if (section === null) {
      section = buildComposer(el);
      root.append(section);
    }
    if (section.dataset.ptbCard !== card) {
      section.dataset.ptbCard = card;
      section.querySelector("textarea").value = "";
      section.querySelector(".ptb-error").textContent = "";
    }
  };

  const boardSheet = new CSSStyleSheet();
  boardSheet.replaceSync(`
    dpk-dialog-panel::part(header),
    .kanban-column[data-column="${ARCHIVED}"],
    .diagram-stats { display: none !important; }

    .kanban-card:is(.is-added, .is-moved) { border-style: solid; border-color: color-mix(in oklab, var(--_card-tone) 24%, var(--dpk-rule)); background: color-mix(in oklab, var(--_card-tone) 6%, var(--dpk-paper-raised)); }
    .kanban-card:is(.is-added, .is-moved)[tabindex]:hover { border-color: color-mix(in oklab, var(--_card-tone) 45%, var(--dpk-rule)); }
    .kanban-card:is(.is-added, .is-moved):is([aria-pressed="true"], :focus-visible) { border-color: var(--dpk-blue); }

    .kanban-card { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 8px; row-gap: var(--dpk-card-gap, 6px); align-items: center; }
    .kanban-card > .dpk-card-head { display: contents; }
    .kanban-card .dpk-card-title { order: 0; grid-column: 1 / -1; }
    .kanban-card > .dpk-card-text { order: 1; grid-column: 1 / -1; }
    .kanban-card .dpk-card-key { order: 2; }
    .kanban-card > .kanban-card-meta { order: 3; }
    .kanban-card > .kanban-card-links { order: 4; grid-column: 1 / -1; }
    .kanban-card::before { order: -1; grid-column: 1 / -1; justify-self: start; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 700; line-height: 20px; letter-spacing: 0.02em; background: light-dark(#b45309, #fbbf24); color: light-dark(#fff, #1c1917); }
    .kanban-card::after { order: 5; grid-column: 1 / -1; font-size: 11px; font-weight: var(--ptb-mark-weight, 400); color: var(--ptb-mark, var(--dpk-ink-soft)); }

    .ptb-archive { font: inherit; font-size: 12px; padding: 2px 8px; border-radius: var(--dpk-radius-sm); border: 1px solid var(--dpk-rule-strong); background: var(--dpk-paper); color: var(--dpk-ink); cursor: pointer; margin-left: auto; flex: none; }
    .ptb-archive:disabled { cursor: default; color: var(--dpk-ink-faint); }

    :host { --ptb-overdue: var(--dpk-danger); --ptb-today: light-dark(#b45309, #fbbf24); }
    .kanban-column[data-column="${SPLIT}"] .kanban-cards::after { content: "${AGENT_TAG}"; order: 1; display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--dpk-ink-faint); background: linear-gradient(var(--dpk-rule-strong), var(--dpk-rule-strong)) no-repeat right center / calc(100% - 4.5em) 1px; }
    .kanban-column-head::after { margin-left: 6px; font-size: 11px; color: var(--dpk-ink-faint); }
  `);

  // 詳細では、kit の担当者 (assignee) とステータスの欄を出さない。担い手は Agent のタグ、列の移動は盤面で行う。
  const detailSheet = new CSSStyleSheet();
  detailSheet.replaceSync(`
    .kanban-detail-field:has(> dpk-inline-edit:not([multiline])),
    .kanban-detail-field:has(> .kanban-statuses) { display: none !important; }
    .ptb-attrs { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12px; }
    .ptb-attrs label { display: inline-flex; align-items: center; gap: 5px; color: var(--dpk-ink-soft); }
    .ptb-toggle { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: transparent; cursor: pointer; }
    .ptb-check { border: 1px solid light-dark(#d97706, #f59e0b); color: light-dark(#92400e, #fcd34d); }
    .ptb-check[aria-pressed="true"] { border-color: transparent; background: light-dark(#b45309, #fbbf24); color: light-dark(#fff, #1c1917); font-weight: 600; }
    .ptb-agent { border: 1px solid var(--dpk-blue); color: var(--dpk-blue); }
    .ptb-agent[aria-pressed="true"] { border-color: transparent; background: var(--dpk-blue); color: var(--dpk-paper); font-weight: 600; }
    .ptb-date { display: inline-flex; align-items: center; gap: 4px; }
    .ptb-attrs input[type="date"] { font: inherit; font-size: 12px; padding: 1px 4px; border: 1px solid var(--dpk-rule-strong); border-radius: var(--dpk-radius-sm); background: var(--dpk-paper); color: var(--dpk-ink); }
    .ptb-clear { font: inherit; font-size: 12px; padding: 1px 6px; border-radius: var(--dpk-radius-sm); border: 1px solid var(--dpk-rule); background: transparent; color: var(--dpk-ink-soft); cursor: pointer; }
    .ptb-assignments { flex-basis: 100%; display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
    .ptb-assignments:empty { display: none; }
    .ptb-assignments li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; color: var(--dpk-ink); }
    .ptb-assignments li[data-status="Done"] { color: var(--dpk-ink-faint); }
    .ptb-assignments .ptb-status { font-size: 11px; font-weight: 600; color: var(--dpk-blue); }
    .ptb-assignments li[data-status="Done"] .ptb-status { color: var(--dpk-ink-faint); }
    .ptb-assignments code { font-size: 11px; color: var(--dpk-ink-soft); overflow-wrap: anywhere; }
    .ptb-error { flex-basis: 100%; margin: 0; font-size: 12px; color: var(--dpk-danger); }
    .ptb-error:empty { display: none; }
    .ptb-comments { display: grid; gap: 6px; }
    .ptb-composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: end; }
    .ptb-composer textarea { font: inherit; font-size: 13px; resize: vertical; min-height: 2.5em; padding: 4px 6px; border: 1px solid var(--dpk-rule-strong); border-radius: var(--dpk-radius-sm); background: var(--dpk-paper); color: var(--dpk-ink); }
    .ptb-composer button { font: inherit; font-size: 12px; padding: 2px 8px; border-radius: var(--dpk-radius-sm); border: 1px solid var(--dpk-rule-strong); background: var(--dpk-paper); color: var(--dpk-ink); cursor: pointer; }
  `);

  // kit のリンクの追加は form の submit で動き、allow-forms の無い sandbox では発火しない。どの sandbox でも動くように、Add の click と Enter で同じ action を書く。
  const addLink = (el, detail, form) => {
    const url = form.querySelector('[data-role="link-url"]');
    const label = form.querySelector('[data-role="link-label"]');
    const value = url?.value.trim() ?? "";
    const card = detail.card?.id;
    if (!card || value === "") return;
    if (!url.checkValidity()) {
      url.setAttribute("aria-invalid", "true");
      url.reportValidity();
      return;
    }
    const name = label?.value.trim() ?? "";
    const ok = el.dispatchElementAction("ADD_CARD_LINK", ["card", card], name === "" ? { url: value } : { url: value, label: name });
    if (ok) {
      url.removeAttribute("aria-invalid");
      form.reset();
    } else {
      url.setAttribute("aria-invalid", "true");
    }
  };

  const interceptLinkAdd = (el, detail) => {
    const root = detail.shadowRoot;
    const formOf = (event) => (event.target instanceof Element ? event.target.closest("form.kanban-link-add") : null);
    root.addEventListener("submit", (event) => {
      if (formOf(event) === null) return;
      event.preventDefault();
      event.stopPropagation();
    }, true);
    root.addEventListener("click", (event) => {
      const form = formOf(event);
      if (form === null || !event.target.closest("button")) return;
      event.preventDefault();
      addLink(el, detail, form);
    }, true);
    root.addEventListener("keydown", (event) => {
      const form = formOf(event);
      if (form === null || event.key !== "Enter" || event.isComposing || !(event.target instanceof HTMLInputElement)) return;
      event.preventDefault();
      addLink(el, detail, form);
    }, true);
  };

  // 詳細のタグの行で、予約タグを汎用のタグとして出さない。
  const detailTagCss = (el, detail) => {
    const card = cardOf(el, detail.card.id);
    const at = reservedAt(card?.tags ?? []);
    return at.length === 0 ? "" : `.kanban-tag-row > .dpk-pill:is(${at.join(", ")}) { display: none; }`;
  };

  // タグの絞り込みに日付ごとの項目を並べない。絞り込みは別の shadow DOM (dpk-tag-filter) にあるので、そこへ stylesheet を足す。
  const filterCss = (el) => {
    const dates = [...new Set(cardsOf(el).flatMap(({ card }) => (card.tags ?? []).filter((tag) => isReserved(tag) && tag !== CHECK_TAG)))];
    return dates.length === 0 ? "" : `button.dpk-tag:is(${dates.map((tag) => `[data-tag="${CSS.escape(tag)}"]`).join(", ")}) { display: none; }`;
  };
  const ensureSheets = (root, sheets) => {
    if (root && sheets.some((sheet) => !root.adoptedStyleSheets.includes(sheet)))
      root.adoptedStyleSheets = [...root.adoptedStyleSheets, ...sheets.filter((sheet) => !root.adoptedStyleSheets.includes(sheet))];
  };
  const replaceCss = (sheet, css) => {
    if (sheet.ptbCss === css) return;
    sheet.replaceSync(css);
    sheet.ptbCss = css;
  };

  // kit の shadow DOM への差し込みは、Done 見出しのアーカイブと、side panel のカード詳細の属性の欄と記録欄の 3 か所。印と隠す処理は stylesheet だけで行う。
  const enhancers = [];
  const enhance = (el) => {
    const root = el.shadowRoot;
    const attrSheet = new CSSStyleSheet();
    const filterSheet = new CSSStyleSheet();
    const detailTagSheet = new CSSStyleSheet();
    root.adoptedStyleSheets = [...root.adoptedStyleSheets, boardSheet, attrSheet];
    const watched = new WeakSet();
    let frame = 0;
    const refresh = () => {
      if (frame !== 0) return;
      frame = requestAnimationFrame(() => {
        frame = 0;
        ensureArchive(el, root);
        updateDeferred();
        replaceCss(attrSheet, attrCss(el));
        ensureSheets(root.querySelector("dpk-tag-filter")?.shadowRoot, [filterSheet]);
        replaceCss(filterSheet, filterCss(el));
        const page = el.closest("dpk-page")?.shadowRoot;
        const panel = page?.querySelector("dpk-internal-layout-panel")?.shadowRoot;
        for (const target of [page, panel]) {
          if (!target || watched.has(target)) continue;
          watched.add(target);
          observer.observe(target, { childList: true, subtree: true });
        }
        const detail = detailOf(el);
        if (detail === null) return;
        if (!watched.has(detail)) {
          watched.add(detail);
          observer.observe(detail.shadowRoot, { childList: true, subtree: true, characterData: true });
          interceptLinkAdd(el, detail);
        }
        ensureSheets(detail.shadowRoot, [detailSheet, detailTagSheet]);
        replaceCss(detailTagSheet, detailTagCss(el, detail));
        ensureAttrs(el, detail);
        ensureComposer(el, detail);
      });
    };
    const observer = new MutationObserver(refresh);
    observer.observe(root, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-card"] });
    el.closest("dpk-page")?.addEventListener("dpk-panel-change", refresh);
    enhancers.push(refresh);
    refresh();
  };

  // Agent Office は、2 つの盤面の担当 (アーカイブを除く) を agent-office.js に渡して描く。
  const officeAgents = () =>
    kanbans.flatMap((el) =>
      cardsOf(el)
        .filter(({ column }) => column !== ARCHIVED)
        .flatMap(({ card }) =>
          assignmentsOf(card).map((a) => ({
            cardId: card.id,
            cardNumber: card.number,
            cardTitle: card.title,
            role: a.role,
            runtime: a.runtime,
            model: a.model,
            status: a.status,
            session: a.session,
          })),
        ),
    );
  let office;
  let officeKey = "";
  const refreshOffice = () => {
    if (office === undefined) return;
    const agents = officeAgents();
    const key = JSON.stringify(agents);
    if (key === officeKey) return;
    officeKey = key;
    office.update(agents);
  };
  const mountOffice = async () => {
    const source = document.getElementById("ptb-agent-office")?.textContent ?? "";
    const container = document.getElementById("ptb-office");
    if (source.trim() === "" || container === null) return;
    const url = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
    try {
      const { mountAgentOffice } = await import(url);
      const agents = officeAgents();
      officeKey = JSON.stringify(agents);
      office = mountAgentOffice(container, agents);
    } finally {
      URL.revokeObjectURL(url);
    }
  };

  const refreshAll = () => {
    for (const refresh of enhancers) refresh();
    refreshOffice();
  };

  // 日付が変わったら、隠すカードと期日の色を描き直す。
  const recheckToday = () => {
    const next = tokyoStamp(new Date()).slice(0, 10);
    if (next === today) return;
    today = next;
    refreshAll();
  };
  setInterval(recheckToday, 60_000);
  document.addEventListener("visibilitychange", recheckToday);
  document.addEventListener("dpk-change", refreshAll);
  await Promise.all([import(KIT), import(PLAIN)]);
  for (const el of kanbans) {
    await el.api.ready;
    enhance(el);
  }
  await mountOffice();
</script>
</body>
</html>
