version = 1

; llama.cpp ルータ用のモデルプリセット。
; キーはコマンドライン引数から先頭の "--" を除いた形で書く(--ctx-size → ctx-size)。
; model / mmproj のパスはモデル置き場 ($LOCAL_LLM_MODELS_DIR、既定 ~/models) からの相対パス。

; ---- 全モデル共通 ----
[*]
; Apple Silicon は統合メモリなので全レイヤを GPU に載せる
n-gpu-layers = 999
flash-attn = on
; GGUF 同梱のチャットテンプレートを使う(ツール呼び出しに必要)
jinja = true
; このモデルは 40 層中 10 層だけが full attention(num_key_value_heads=2, head_dim=256)。
; 残りは線形注意なので KV キャッシュが小さく、長いコンテキストでもメモリを食わない。
; 131072 トークンで KV は約 2.7GiB(f16)。ネイティブ上限は 262144。
ctx-size = 131072
; 投機デコードと KV 再利用を効かせるため 1 スロット
parallel = 1
; 使っていない間は重みを解放する。次のリクエストで読み直す
sleep-idle-seconds = 600

; ---- Qwen3.6-35B-A3B uncensored (Heretic + MPOA) ----
; SC117 APEX I-Compact: MoE 対応の混合精度量子化 + MTP ヘッド温存
; 参考: https://huggingface.co/SC117/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-APEX-GGUF
; 取得は local-llm/pull.sh
[qwen3.6-35b-a3b-uncensored]
model = qwen3.6-35b-a3b-uncensored/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-APEX-I-Compact.gguf
mmproj = qwen3.6-35b-a3b-uncensored/mmproj-Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-APEX-F16.gguf
; モデル内蔵の MTP ヘッドを draft に使う投機デコード(別途 draft モデル不要)
spec-type = draft-mtp
spec-draft-n-max = 2
