# 外部リポジトリで管理されている skill を取得して ~/.agents/skills に配布する。
# refreshPeriod ごとに上流の main を取り直す (即時更新は `chezmoi apply --refresh-externals`)。

[".agents/skills/dev-process-kit"]
type = "archive"
url = "https://github.com/d-kimuson/dev-process-kit/archive/refs/heads/main.tar.gz"
exact = true
stripComponents = 3
include = ["*/skills/dev-process-kit", "*/skills/dev-process-kit/**"]
refreshPeriod = "168h"
